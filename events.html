<!DOCTYPE html>
<html lang="zh-CN">

<title>金鸽杯活动</title>
<meta name="description" content="金鸽杯常驻巡回赛、特别活动和历届赛事记录。">
<style>
:root{--ink:#17241e;--green:#143323;--forest:#0f291d;--ivory:#f8efd7;--paper:#fffaf0;--sand:#ead9b6;--gold:#c99a3c;--clay:#a9653c;--line:rgba(20,51,35,.17);--phoenix:#9c3f32}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--sand);font-family:Songti SC,STSong,Georgia,"Times New Roman",serif}a{color:inherit;text-decoration:none}
.hero{position:relative;min-height:52svh;padding:28px clamp(18px,5vw,72px) 52px;color:var(--ivory);isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.hero:before{position:absolute;inset:0;z-index:-2;background:url("golden-dove-cup-hero-v3.webp") right center/cover no-repeat;content:""}.hero:after{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(9,27,18,.94) 0%,rgba(9,27,18,.75) 43%,rgba(9,27,18,.12) 78%),linear-gradient(180deg,rgba(9,27,18,.08),rgba(9,27,18,.68));content:""}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.1em;text-transform:uppercase}.brand-mark{display:block;width:38px;height:38px;flex:0 0 auto;overflow:hidden;border:1px solid rgba(248,239,215,.62);border-radius:50%;background:#fff}.brand-mark img{display:block;width:100%;height:100%;object-fit:cover}.home-link{padding:10px 14px;border:1px solid rgba(248,239,215,.46);border-radius:999px;font-family:"Avenir Next","Segoe UI",sans-serif;font-size:11px;font-weight:800;letter-spacing:.06em}.hero-copy{max-width:760px}.kicker{color:#e3bc65;font-family:"Avenir Next","Segoe UI",sans-serif;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{margin:14px 0 0;font-size:clamp(54px,8vw,104px);font-weight:400;line-height:.9;letter-spacing:0}.lead{max-width:660px;margin:18px 0 0;color:rgba(248,239,215,.84);font-family:"Avenir Next","Segoe UI","PingFang SC",sans-serif;font-size:16px;line-height:1.75}
.event-section{padding:clamp(52px,7vw,88px) clamp(18px,5vw,72px)}.event-section.special{background:#f6ead0}.event-section.archive{background:#e6dfd1}.section-inner{max-width:1260px;margin:0 auto}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.section-head h2{margin:10px 0 0;font-size:clamp(38px,5vw,66px);font-weight:400;line-height:1}.count{color:var(--clay);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:12px;font-weight:900;letter-spacing:.06em}.event-list{display:grid;gap:18px;margin-top:30px}
.resident-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,.65fr) minmax(270px,.8fr);border:1px solid var(--line);background:var(--paper)}.resident-main{padding:clamp(28px,4vw,48px)}.status{display:inline-flex;padding:6px 9px;color:#75521f;background:#efe3c8;font-family:"Avenir Next","Segoe UI",sans-serif;font-size:10px;font-weight:900;letter-spacing:.07em}.status-upcoming{color:#8c2f27;background:#f3d8d3}.status-live{color:#155c36;background:#d9eadf}.status-ended{color:#24577d;background:#dbe8f1}.resident-main h3,.special-content h3{margin:22px 0 10px;font-size:clamp(34px,4vw,56px);font-weight:400;line-height:1}.resident-main p,.special-content p{margin:0;color:#706b5e;font-family:"Avenir Next","Segoe UI","PingFang SC",sans-serif;line-height:1.75}.resident-meta{display:grid;align-content:center;gap:22px;padding:30px;border-left:1px solid var(--line)}.meta span{display:block;color:var(--clay);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.meta strong{display:block;margin-top:6px;font-size:19px;font-weight:400;line-height:1.35}.tool-list{display:grid;align-content:center;border-left:1px solid var(--line)}.tool-link{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);transition:background .18s,color .18s}.tool-link:last-child{border-bottom:0}.tool-link:hover,.tool-link:focus-visible{color:#fff;background:var(--green);outline:0}.tool-link strong{display:block;font-size:18px;font-weight:400}.tool-link small{display:block;margin-top:5px;color:#7c7567;font-family:"Avenir Next","Segoe UI","PingFang SC",sans-serif;font-size:11px;line-height:1.45}.tool-link:hover small,.tool-link:focus-visible small{color:rgba(255,255,255,.72)}.arrow{font-family:"Avenir Next","Segoe UI",sans-serif;font-size:20px}
.special-row{display:grid;grid-template-columns:180px minmax(0,1fr) 270px;border:1px solid var(--line);background:var(--paper)}.date{display:grid;align-content:space-between;min-height:260px;padding:24px;color:#fff;background:var(--phoenix)}.date strong{font-size:64px;font-weight:400}.date span{font-family:"Avenir Next","Segoe UI",sans-serif;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.special-content{padding:32px}.special-side{display:grid;align-content:center;gap:18px;padding:28px;border-left:1px solid var(--line)}.button{display:inline-flex;justify-content:center;padding:13px 16px;color:#fff;background:var(--green);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:11px;font-weight:900;letter-spacing:.06em}.empty{padding:36px;border:1px solid var(--line);background:var(--paper);color:#706b5e}footer{display:flex;justify-content:space-between;gap:16px;padding:28px clamp(18px,5vw,72px);background:var(--forest);color:var(--ivory);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:12px}
.archive-row{display:grid;grid-template-columns:210px minmax(0,1fr) 280px;border:1px solid var(--line);background:var(--paper)}.archive-date{position:relative;isolation:isolate;display:grid;align-content:space-between;min-height:250px;padding:24px;overflow:hidden;color:#fff;background:#315e7c}.archive-date:after{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,27,18,.24),rgba(9,27,18,.88));content:""}.archive-cover-image{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}.archive-date strong{font-size:58px;font-weight:400}.archive-date span{font-family:"Avenir Next","Segoe UI",sans-serif;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.archive-main{padding:30px 32px}.archive-main h3{margin:20px 0 22px;font-size:clamp(34px,4vw,54px);font-weight:400;line-height:1}.result-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.result-list div{padding:14px 16px;border-right:1px solid var(--line)}.result-list div:first-child{padding-left:0}.result-list div:last-child{border-right:0}.result-list span{display:block;color:var(--clay);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.result-list strong{display:block;margin-top:6px;font-size:18px;font-weight:400}.archive-side{display:grid;align-content:center;gap:16px;padding:28px;border-left:1px solid var(--line)}.gallery-meta{padding-top:16px;border-top:1px solid var(--line)}.gallery-meta span{display:block;color:var(--clay);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:9px;font-weight:900;text-transform:uppercase}.gallery-meta strong{display:block;margin-top:5px;font-size:17px;font-weight:400}.gallery-link{display:inline-flex;justify-content:center;padding:11px 14px;border:1px solid var(--green);color:var(--green);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:10px;font-weight:900;text-transform:uppercase}
.archive-cover-image{object-position:center 72%}
@media(max-width:960px){.resident-row{grid-template-columns:minmax(0,1fr) minmax(220px,.7fr)}.resident-main{grid-column:1/-1}.resident-meta{border-left:0;border-top:1px solid var(--line)}.tool-list{border-top:1px solid var(--line)}.archive-row{grid-template-columns:160px minmax(0,1fr)}.archive-side{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:760px){.hero{min-height:460px;padding-bottom:38px}.hero:before{background-position:68% center}.hero:after{background:linear-gradient(90deg,rgba(9,27,18,.9),rgba(9,27,18,.35)),linear-gradient(180deg,rgba(9,27,18,.08),rgba(9,27,18,.85))}.lead{font-size:14px}.section-head{align-items:flex-start;flex-direction:column}.resident-row,.special-row,.archive-row{grid-template-columns:1fr}.resident-main{grid-column:auto}.resident-meta,.tool-list,.special-side,.archive-side{grid-column:auto;border-left:0;border-top:1px solid var(--line)}.date,.archive-date{min-height:156px}.date strong,.archive-date strong{font-size:54px}.special-content,.archive-main{padding:28px 24px}.result-list{grid-template-columns:1fr}.result-list div,.result-list div:first-child{padding:12px 0;border-right:0;border-bottom:1px solid var(--line)}.result-list div:last-child{border-bottom:0}footer{flex-direction:column}}
@media(max-width:430px){.hero{min-height:430px}.brand{gap:8px;font-size:12px}.brand-mark{width:34px;height:34px}.home-link{padding:9px 11px}h1{font-size:50px}.event-section{padding-top:46px;padding-bottom:46px}.section-head h2{font-size:40px}.resident-main{padding:26px 22px}.resident-meta{padding:24px 22px}.tool-link{padding:18px 22px}}
</style>
<link rel="stylesheet" href="moments.css?v=7">
</head>
<body>
<header class="hero">
  <div class="topbar"><a class="brand" href="./"><span class="brand-mark"><img src="golden-dove-mark.webp" alt=""></span><span>Golden Dove Cup</span></a><a class="home-link" href="./">返回主页</a></div>
  <div class="hero-copy"><div class="kicker">Dove Cup Calendar</div><h1>活动中心</h1><p class="lead">每周持续开放的巡回赛，以及不定期举行的团体赛与主题赛，都集中在这里。</p></div>
</header>
<main>
  <section class="event-section special" id="special">
    <div class="section-inner">
      <div class="section-head"><div><div class="kicker" style="color:var(--clay)">Live & Upcoming</div><h2>进行中与即将开始</h2></div><div class="count" id="specialCount">0 场活动</div></div>
      <div class="event-list" id="specialList"></div>
    </div>
  </section>
  <section class="event-section" id="resident">
    <div class="section-inner">
      <div class="section-head"><div><div class="kicker" style="color:var(--clay)">Resident Events</div><h2>常驻活动</h2></div><div class="count" id="residentCount">0 场常驻活动</div></div>
      <div class="event-list" id="residentList"></div>
    </div>
  </section>
  <section class="event-section moment-archive" id="moments">
    <div class="section-inner">
      <div class="section-head"><div><div class="kicker" style="color:var(--clay)">Event Archive</div><h2>活动照片档案</h2></div><div class="count" id="momentArchiveCount">0 张照片</div></div>
      <div class="moment-archive-grid" id="momentArchiveList"></div>
    </div>
  </section>
  <section class="event-section archive" id="archive">
    <div class="section-inner">
      <div class="section-head"><div><div class="kicker" style="color:var(--clay)">Past Events</div><h2>往期活动</h2></div><div class="count" id="archiveCount">0 场往期活动</div></div>
      <div class="event-list" id="archiveList"></div>
    </div>
  </section>
</main>
<footer><span>Golden Dove Cup / 金鸽杯</span><span>Toronto tennis events and team specials.</span></footer>
<script src="events-data.js?v=18"></script>
<script src="moments-data.js?v=9"></script>
<script src="gallery.js?v=3"></script>
<script src="moments.js?v=8"></script>
<script>
(function renderEvents(){
  const recurring=window.DOVE_RECURRING_EVENTS||[],special=window.DOVE_EVENTS||[];
  const clean=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const activeSpecial=special.filter(event=>window.DoveEventStatus.forEvent(event)!=='已结束');
  const pastSpecial=special.filter(event=>window.DoveEventStatus.forEvent(event)==='已结束');
  const residentTarget=document.getElementById('residentList'),specialTarget=document.getElementById('specialList'),archiveTarget=document.getElementById('archiveList');
  const updateCounts=language=>{
    const lang=language||(window.DoveLanguage&&window.DoveLanguage.getLanguage?window.DoveLanguage.getLanguage():'zh');
    document.getElementById('residentCount').textContent=lang==='en'?`${recurring.length} Recurring Event${recurring.length===1?'':'s'}`:`${recurring.length} 场常驻活动`;
    document.getElementById('specialCount').textContent=lang==='en'?`${activeSpecial.length} Live / Upcoming`:`${activeSpecial.length} 场进行中或即将开始`;
    document.getElementById('archiveCount').textContent=lang==='en'?`${pastSpecial.length} Past Event${pastSpecial.length===1?'':'s'}`:`${pastSpecial.length} 场往期活动`;
  };
  document.addEventListener('DOMContentLoaded',()=>updateCounts(),{once:true});
  window.addEventListener('dove:languagechange',event=>updateCounts(event.detail&&event.detail.language));
  residentTarget.innerHTML=recurring.length?recurring.map(event=>`<article class="resident-row"><div class="resident-main"><span class="status">${clean(event.status)}</span><h3>${clean(event.title)}</h3><p>${clean(event.summary)}</p></div><div class="resident-meta"><div class="meta"><span>Schedule</span><strong>${clean(event.schedule)}</strong></div><div class="meta"><span>Venue</span><strong>${clean(event.venue)}</strong></div><div class="meta"><span>Format</span><strong>${clean(event.format)}</strong></div></div><div class="tool-list">${(event.tools||[]).map(tool=>`<a class="tool-link" href="${clean(tool.href)}"><span><strong>${clean(tool.label)}</strong><small>${clean(tool.hint)}</small></span><span class="arrow" aria-hidden="true">→</span></a>`).join('')}</div></article>`).join(''):'<div class="empty">新的常驻活动正在准备中。</div>';
  specialTarget.innerHTML=activeSpecial.length?activeSpecial.map(event=>{const date=new Date(`${event.date}T12:00:00`),day=String(date.getDate()).padStart(2,'0'),month=date.toLocaleDateString('en-CA',{month:'short'}).toUpperCase(),status=window.DoveEventStatus.forEvent(event),statusClass=window.DoveEventStatus.classFor(status);return`<article class="special-row"><div class="date"><span>${clean(event.dateLabel)}</span><strong>${day}</strong><span>${month} · ${date.getFullYear()}</span></div><div class="special-content"><span class="status ${statusClass}">${clean(status)}</span><h3>${clean(event.title)}</h3><p>${clean(event.summary)}</p></div><div class="special-side"><div class="meta"><span>Venue</span><strong>${clean(event.venue)}</strong></div><div class="meta"><span>Format</span><strong>${clean(event.format)}</strong></div><a class="button" href="${clean(event.href)}">查看活动</a></div></article>`}).join(''):'<div class="empty">新活动筹备中，公布后会出现在这里。</div>';
  archiveTarget.innerHTML=pastSpecial.length?pastSpecial.map(event=>{const date=new Date(`${event.date}T12:00:00`),day=String(date.getDate()).padStart(2,'0'),month=date.toLocaleDateString('en-CA',{month:'short'}).toUpperCase(),result=event.result||{},gallery=window.DoveGallery.galleryFor(event),hasPhotos=window.DoveGallery.hasPhotos(event),cover=window.DoveGallery.coverFor(event),photoCount=window.DoveGallery.photosFor(event).length,eventLabel=Number(event.eventNumber)?` · EVENT ${Number(event.eventNumber)}`:'',archiveStats=Array.isArray(event.archiveStats)&&event.archiveStats.length?event.archiveStats:[{label:'参赛人数',value:`${Number(event.attendeeCount)||0} 人参赛`},{label:'团队比分',value:`${result.winner||''} ${Number(result.winnerPoints)||0}:${Number(result.loserPoints)||0} 获胜`},{label:'总局数',value:`总局数 ${Number(result.winnerGames)||0}:${Number(result.loserGames)||0}`}];return`<article class="archive-row"><div class="archive-date">${cover?`<img class="archive-cover-image" src="${clean(cover)}" alt="${clean(window.DoveGallery.copy(gallery,'coverAlt','zh'))}" loading="lazy">`:''}<span>${clean(event.dateLabel)}</span><strong>${day}</strong><span>${month} · ${date.getFullYear()}</span></div><div class="archive-main"><span class="status status-ended">已结束</span><h3>${clean(event.title)}</h3><div class="result-list">${archiveStats.map(item=>`<div><span>${clean(item.label)}</span><strong>${clean(item.value)}</strong></div>`).join('')}</div></div><div class="archive-side"><div class="meta"><span>Venue</span><strong>${clean(event.venue)}</strong></div><div class="meta"><span>Format</span><strong>${clean(event.format)}</strong></div>${gallery?`<div class="gallery-meta"><span>Photo Archive${eventLabel}</span><strong>${hasPhotos?`${photoCount} 张活动照片`:'现场照片整理中'}</strong></div>`:''}<a class="button" href="${clean(event.href)}">${clean(event.archiveAction||'查看完整赛果')}</a>${gallery?`<a class="gallery-link" href="${clean(event.href)}#gallery">${hasPhotos?'浏览活动影集':'查看影集位置'}</a>`:''}</div></article>`}).join(''):'<div class="empty">还没有往期活动。</div>';
}());
window.DoveMoments.mountArchive('momentArchiveList','momentArchiveCount');
</script>
</body>
</html>
