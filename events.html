<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="language.css?v=1">
<script src="language.js?v=7"></script>
<title>金鸽杯活动</title>
<meta name="description" content="金鸽杯常驻巡回赛、特别活动和历届赛事记录。">
<style>
:root{--ink:#17241e;--green:#143323;--forest:#0f291d;--ivory:#f8efd7;--paper:#fffaf0;--sand:#ead9b6;--gold:#c99a3c;--clay:#a9653c;--line:rgba(20,51,35,.17);--phoenix:#9c3f32}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--sand);font-family:Songti SC,STSong,Georgia,"Times New Roman",serif}a{color:inherit;text-decoration:none}
.hero{position:relative;min-height:52svh;padding:28px clamp(18px,5vw,72px) 52px;color:var(--ivory);isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.hero:before{position:absolute;inset:0;z-index:-2;background:url("golden-dove-cup-hero-v3.webp") right center/cover no-repeat;content:""}.hero:after{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(9,27,18,.94) 0%,rgba(9,27,18,.75) 43%,rgba(9,27,18,.12) 78%),linear-gradient(180deg,rgba(9,27,18,.08),rgba(9,27,18,.68));content:""}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:14px;letter-spacing:.1em;text-transform:uppercase}.home-link{padding:10px 14px;border:1px solid rgba(248,239,215,.46);border-radius:999px;font-family:"Avenir Next","Segoe UI",sans-serif;font-size:11px;font-weight:800;letter-spacing:.06em}.hero-copy{max-width:760px}.kicker{color:#e3bc65;font-family:"Avenir Next","Segoe UI",sans-serif;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{margin:14px 0 0;font-size:clamp(54px,8vw,104px);font-weight:400;line-height:.9;letter-spacing:0}.lead{max-width:660px;margin:18px 0 0;color:rgba(248,239,215,.84);font-family:"Avenir Next","Segoe UI","PingFang SC",sans-serif;font-size:16px;line-height:1.75}
.event-section{padding:clamp(52px,7vw,88px) clamp(18px,5vw,72px)}.event-section.special{background:#f6ead0}.section-inner{max-width:1260px;margin:0 auto}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.section-head h2{margin:10px 0 0;font-size:clamp(38px,5vw,66px);font-weight:400;line-height:1}.count{color:var(--clay);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:12px;font-weight:900;letter-spacing:.06em}.event-list{display:grid;gap:18px;margin-top:30px}
.resident-row{display:grid;grid-template-columns:minmax(190px,.58fr) minmax(0,1.05fr) minmax(210px,.58fr) minmax(250px,.72fr);border:1px solid var(--line);background:var(--paper)}.resident-logo{display:grid;place-items:center;padding:20px;border-right:1px solid var(--line);background:#f1f2e9}.resident-logo img{display:block;width:100%;max-width:250px;height:auto;mix-blend-mode:multiply}.resident-main{padding:clamp(28px,4vw,48px)}.status{display:inline-flex;padding:6px 9px;color:#7f332b;background:#f0ded0;font-family:"Avenir Next","Segoe UI",sans-serif;font-size:10px;font-weight:900;letter-spacing:.07em}.resident-main h3,.special-content h3{margin:22px 0 10px;font-size:clamp(34px,4vw,56px);font-weight:400;line-height:1}.resident-main p,.special-content p{margin:0;color:#706b5e;font-family:"Avenir Next","Segoe UI","PingFang SC",sans-serif;line-height:1.75}.resident-meta{display:grid;align-content:center;gap:22px;padding:30px;border-left:1px solid var(--line)}.meta span{display:block;color:var(--clay);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.meta strong{display:block;margin-top:6px;font-size:19px;font-weight:400;line-height:1.35}.tool-list{display:grid;align-content:center;border-left:1px solid var(--line)}.tool-link{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);transition:background .18s,color .18s}.tool-link:last-child{border-bottom:0}.tool-link:hover,.tool-link:focus-visible{color:#fff;background:var(--green);outline:0}.tool-link strong{display:block;font-size:18px;font-weight:400}.tool-link small{display:block;margin-top:5px;color:#7c7567;font-family:"Avenir Next","Segoe UI","PingFang SC",sans-serif;font-size:11px;line-height:1.45}.tool-link:hover small,.tool-link:focus-visible small{color:rgba(255,255,255,.72)}.arrow{font-family:"Avenir Next","Segoe UI",sans-serif;font-size:20px}
.special-row{display:grid;grid-template-columns:180px minmax(0,1fr) 270px;border:1px solid var(--line);background:var(--paper)}.date{display:grid;align-content:space-between;min-height:260px;padding:24px;color:#fff;background:var(--phoenix)}.date strong{font-size:64px;font-weight:400}.date span{font-family:"Avenir Next","Segoe UI",sans-serif;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.special-content{padding:32px}.special-side{display:grid;align-content:center;gap:18px;padding:28px;border-left:1px solid var(--line)}.button{display:inline-flex;justify-content:center;padding:13px 16px;color:#fff;background:var(--green);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:11px;font-weight:900;letter-spacing:.06em}.empty{padding:36px;border:1px solid var(--line);background:var(--paper);color:#706b5e}footer{display:flex;justify-content:space-between;gap:16px;padding:28px clamp(18px,5vw,72px);background:var(--forest);color:var(--ivory);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:12px}
@media(max-width:1100px){.resident-row{grid-template-columns:minmax(220px,.65fr) minmax(0,1fr)}.resident-meta{border-left:0;border-top:1px solid var(--line)}.tool-list{border-top:1px solid var(--line)}}
@media(max-width:760px){.hero{min-height:460px;padding-bottom:38px}.hero:before{background-position:68% center}.hero:after{background:linear-gradient(90deg,rgba(9,27,18,.9),rgba(9,27,18,.35)),linear-gradient(180deg,rgba(9,27,18,.08),rgba(9,27,18,.85))}.lead{font-size:14px}.section-head{align-items:flex-start;flex-direction:column}.resident-row,.special-row{grid-template-columns:1fr}.resident-logo{padding:18px;border-right:0}.resident-logo img{max-width:270px}.resident-main{grid-column:auto}.resident-meta,.tool-list,.special-side{border-left:0;border-top:1px solid var(--line)}.date{min-height:156px}.date strong{font-size:54px}.special-content{padding:28px 24px}footer{flex-direction:column}}
@media(max-width:430px){.hero{min-height:430px}.brand{font-size:12px}.home-link{padding:9px 11px}h1{font-size:50px}.event-section{padding-top:46px;padding-bottom:46px}.section-head h2{font-size:40px}.resident-main{padding:26px 22px}.resident-meta{padding:24px 22px}.tool-link{padding:18px 22px}}
</style>
</head>
<body>
<header class="hero">
  <div class="topbar"><a class="brand" href="index.html">Golden Dove Cup</a><a class="home-link" href="index.html">返回主页</a></div>
  <div class="hero-copy"><div class="kicker">Dove Cup Calendar</div><h1>活动中心</h1><p class="lead">每周持续开放的巡回赛，以及不定期举行的团体赛与主题赛，都集中在这里。</p></div>
</header>
<main>
  <section class="event-section" id="resident">
    <div class="section-inner">
      <div class="section-head"><div><div class="kicker" style="color:var(--clay)">Resident Events</div><h2>常驻活动</h2></div><div class="count" id="residentCount">0 场常驻活动</div></div>
      <div class="event-list" id="residentList"></div>
    </div>
  </section>
  <section class="event-section special" id="special">
    <div class="section-inner">
      <div class="section-head"><div><div class="kicker" style="color:var(--clay)">Special Event Series</div><h2>特殊活动</h2></div><div class="count" id="specialCount">0 场特殊活动</div></div>
      <div class="event-list" id="specialList"></div>
    </div>
  </section>
</main>
<footer><span>Golden Dove Cup / 金鸽杯</span><span>Toronto tennis events and team specials.</span></footer>
<script src="events-data.js?v=3"></script>
<script>
(function renderEvents(){
  const recurring=window.DOVE_RECURRING_EVENTS||[],special=window.DOVE_EVENTS||[];
  const clean=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const residentTarget=document.getElementById('residentList'),specialTarget=document.getElementById('specialList');
  const updateCounts=language=>{
    const lang=language||(window.DoveLanguage&&window.DoveLanguage.getLanguage?window.DoveLanguage.getLanguage():'zh');
    document.getElementById('residentCount').textContent=lang==='en'?`${recurring.length} Recurring Event${recurring.length===1?'':'s'}`:`${recurring.length} 场常驻活动`;
    document.getElementById('specialCount').textContent=lang==='en'?`${special.length} Special Event${special.length===1?'':'s'}`:`${special.length} 场特殊活动`;
  };
  document.addEventListener('DOMContentLoaded',()=>updateCounts(),{once:true});
  window.addEventListener('dove:languagechange',event=>updateCounts(event.detail&&event.detail.language));
  residentTarget.innerHTML=recurring.length?recurring.map(event=>`<article class="resident-row">${event.logo?`<div class="resident-logo"><img src="${clean(event.logo)}" alt="${clean(event.title)} Logo"></div>`:''}<div class="resident-main"><span class="status">${clean(event.status)}</span><h3>${clean(event.title)}</h3><p>${clean(event.summary)}</p></div><div class="resident-meta"><div class="meta"><span>Schedule</span><strong>${clean(event.schedule)}</strong></div><div class="meta"><span>Venue</span><strong>${clean(event.venue)}</strong></div><div class="meta"><span>Format</span><strong>${clean(event.format)}</strong></div></div><div class="tool-list">${(event.tools||[]).map(tool=>`<a class="tool-link" href="${clean(tool.href)}"><span><strong>${clean(tool.label)}</strong><small>${clean(tool.hint)}</small></span><span class="arrow" aria-hidden="true">→</span></a>`).join('')}</div></article>`).join(''):'<div class="empty">新的常驻活动正在准备中。</div>';
  specialTarget.innerHTML=special.length?special.map(event=>{const date=new Date(`${event.date}T12:00:00`),day=String(date.getDate()).padStart(2,'0'),month=date.toLocaleDateString('en-CA',{month:'short'}).toUpperCase();return`<article class="special-row"><div class="date"><span>${clean(event.dateLabel)}</span><strong>${day}</strong><span>${month} · ${date.getFullYear()}</span></div><div class="special-content"><span class="status">${clean(event.status)}</span><h3>${clean(event.title)}</h3><p>${clean(event.summary)}</p></div><div class="special-side"><div class="meta"><span>Venue</span><strong>${clean(event.venue)}</strong></div><div class="meta"><span>Format</span><strong>${clean(event.format)}</strong></div><a class="button" href="${clean(event.href)}">查看活动</a></div></article>`}).join(''):'<div class="empty">新的特殊活动正在准备中。</div>';
}());
</script>
</body>
</html>
