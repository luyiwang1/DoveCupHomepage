<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>收款与套餐 · 金鸽杯</title>
<link rel="stylesheet" href="site-nav.css?v=2"><link rel="stylesheet" href="language.css?v=1">
<script src="language.js?v=40"></script><script src="site-nav.js?v=2" defer></script>
<script src="player-identity.js?v=1"></script><script src="finance-ledger.js?v=2"></script><script src="finance-store.js?v=3"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:#1a3025;font:14px "Segoe UI","PingFang SC",sans-serif}main{max-width:1180px;margin:auto;padding:28px 20px 100px}header.finance-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 16px}button,input,select{font:inherit}button{cursor:pointer;background:white;color:#173e2c;border:1px solid #b9c7bd;padding:9px 12px;border-radius:4px}button.primary{background:#174b34;color:white;border-color:#174b34}button:disabled{opacity:.4;cursor:default}a{color:#174b34}.actions{display:flex;gap:8px;flex-wrap:wrap}.local-notice{padding:12px 0;color:#755622;font-size:13px;line-height:1.6;border-bottom:1px solid #d7dcd2;margin:16px 0 20px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:12px 0 24px;border-bottom:1px solid #d7dcd2}.metric span{display:block;font-size:12px;color:#637368}.metric strong{display:block;font-size:26px;margin-top:5px}.view-tabs{display:flex;gap:22px;border-bottom:1px solid #d7dcd2;margin-top:20px}.view-tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:14px 0}.view-tabs button[aria-selected=true]{border-color:#174b34;font-weight:700}section.band{padding:24px 0;border-bottom:1px solid #d7dcd2}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:6px;min-width:130px}.field.grow{flex:1}label{font-size:12px;color:#637368}input,select{padding:9px;border:1px solid #b9c7bd;background:white;border-radius:4px;min-width:0;max-width:100%}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #dde2da;white-space:nowrap}th{font-size:12px;font-weight:600;color:#637368;background:#eaf0e9}td:first-child{font-weight:600}.empty{padding:32px 0;color:#637368}.positive{color:#276443}.negative{color:#955239}#message{min-height:22px;color:#98562f;margin-top:12px}.entry-form{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.member-button{border:0;padding:0;background:none;text-decoration:underline;text-underline-offset:3px}.detail{margin-top:24px;padding-top:20px;border-top:1px solid #d7dcd2}.hidden,[hidden]{display:none!important}.preview-badge{color:#a36424;font-weight:700}.gate{padding:60px 0}#restoreFile{max-width:220px}@media(max-width:600px){main{padding:20px 16px 100px}.metrics{gap:12px}.metric strong{font-size:22px}.field{min-width:130px;flex:1}h1{font-size:24px}.entry-form button{width:100%}}
@media(max-width:600px){#memberTable{min-width:0;display:block}#memberTable thead{display:none}#memberRows{display:grid;gap:0}#memberRows tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px;padding:16px 0;border-bottom:1px solid #d7dcd2}#memberRows td{display:block;padding:0;border:0;white-space:normal;font-size:16px}#memberRows td:first-child{grid-column:1/-1}#memberRows td:not(:first-child):before{display:block;content:attr(data-label);font-size:11px;font-weight:400;color:#637368;margin-bottom:5px}#memberRows td:nth-child(5){color:#174b34}#memberRows td:nth-child(5) strong{font-size:22px}}
.receipt-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 0 20px}.receipt-summary span{display:block;color:#637368;font-size:12px;margin-bottom:6px}.receipt-summary strong{font-size:14px;font-weight:600;line-height:1.6}@media(max-width:600px){.receipt-summary{grid-template-columns:1fr;gap:12px}}
</style></head>
<body><main>
<header class="finance-head"><h1>收款与套餐</h1><div class="actions"><a href="signup.html">返回报名页</a><button id="demoButton" type="button">查看示例</button><button id="importPayments" type="button">同步已核实收款</button><button id="exportButton" type="button">导出备份</button></div></header>
<div id="gate" class="gate" hidden><p>请先在报名页登录管理员，或查看示例。</p><a href="signup.html">进入报名页</a></div>
<div id="workspace">
<p class="local-notice">本机账本预览：明细仅保存在当前浏览器，不跨设备同步。请定期导出备份。</p>
<div id="demoNotice" class="preview-badge" hidden>示例数据，不会写入本机账本。</div>
<div class="metrics"><div class="metric"><span>累计实收</span><strong id="totalMoney">$0</strong></div><div class="metric"><span>套餐剩余总次数</span><strong id="totalVisits">0</strong></div><div class="metric"><span>有账目会员</span><strong id="totalMembers">0</strong></div></div>
<div class="view-tabs" role="tablist"><button id="membersTab" role="tab" aria-selected="true">会员账目</button><button id="sessionTab" role="tab" aria-selected="false">每场对账</button></div>
<section class="band" id="membersView"><div class="toolbar"><div class="field grow"><label for="search">查找姓名</label><input id="search" type="search"></div></div><div class="table-wrap"><table id="memberTable"><thead><tr><th>姓名</th><th>累计实收</th><th>套餐已购</th><th>套餐已用</th><th>剩余</th><th>确认到场</th></tr></thead><tbody id="memberRows"></tbody></table></div><div id="memberEmpty" class="empty">还没有收款记录。</div><div id="memberDetail" class="detail" hidden></div></section>
<section class="band" id="sessionView" hidden><div class="toolbar"><div class="field"><label for="filterDate">日期</label><input type="date" id="filterDate"></div><div class="field"><label for="filterVenue">场地</label><select id="filterVenue"><option value="all">全部场地</option><option value="mrtc">MRTC</option><option value="nyta-east">NYTA East Bubble</option></select></div><strong id="sessionTotal"></strong></div><div class="table-wrap"><table><thead><tr><th>姓名</th><th>项目</th><th>实收金额</th><th>套餐变动</th><th>操作</th></tr></thead><tbody id="sessionRows"></tbody></table></div><div class="empty" id="sessionEmpty">本场次没有账目。</div></section>
<section class="band"><h2>记录收款或到场</h2><form class="entry-form" id="entryForm"><div class="field"><label for="entryName">姓名</label><input id="entryName" list="memberNames" required><datalist id="memberNames"></datalist></div><div class="field"><label for="entryDate">日期</label><input id="entryDate" type="date" required></div><div class="field"><label for="entryVenue">场地</label><select id="entryVenue"><option value="mrtc">MRTC</option><option value="nyta-east">NYTA East Bubble</option></select></div><div class="field"><label for="entryType">项目</label><select id="entryType"><option value="single">单次收款</option><option value="package10">购买10次套餐</option><option value="attendance">确认单次到场</option><option value="usage">确认套餐到场 · 扣1次</option></select></div><div class="field" id="amountField"><label for="entryAmount">实际收到 CAD</label><input id="entryAmount" type="number" min="0.01" step="0.01" value="40"></div><div class="field grow"><label for="entryNote">备注</label><input id="entryNote" maxlength="200"></div><button class="primary" type="submit">保存记录</button></form><div id="message" role="status"></div></section>
<section class="band"><h2>恢复备份</h2><div class="actions"><button type="button" id="restoreButton">选择备份文件</button><button type="button" id="resetFinanceButton">清零收款与套餐</button><button type="button" id="resetBackupButton">导出清零前备份</button></div><input type="file" id="restoreFile" accept="application/json,.json" hidden></section>
</div></main>
<dialog id="resetFinanceDialog" style="max-width:440px;width:calc(100% - 32px);padding:24px;border:1px solid #b9c7bd;border-radius:6px;color:#1a3025"><h2>清零收款与套餐</h2><p style="line-height:1.7">将累计实收和套餐次数归零，保留确认到场记录。当前账本会先自动备份，旧收款不会重新同步。此操作只影响本浏览器。</p><div class="actions"><button type="button" id="cancelFinanceReset">取消</button><button type="button" class="primary" id="confirmFinanceReset">确认归零</button></div><p id="resetFinanceError" role="alert"></p></dialog>
<script src="finance.js?v=4"></script></body></html>
