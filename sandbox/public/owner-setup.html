<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dove Cup QA · Owner Setup</title><link rel="stylesheet" href="/staging/app.css"><link rel="stylesheet" href="/language.css"><script src="/staging/owner-setup.js" defer></script></head>
<body class="guest-account"><div class="environment" id="environment">QA 测试环境 · 独立数据库</div><header class="app-nav"><a class="brand" href="/"><img src="/golden-dove-mark.webp" alt="Golden Dove Cup"><span>GOLDEN DOVE CUP / QA</span></a></header><main><section class="auth-empty"><h1 id="title">创建 QA 管理员</h1><form id="ownerForm" class="stack"><label class="field"><span id="codeLabel">私密初始化码</span><input name="setupToken" autocomplete="off" minlength="32" maxlength="100" required></label><label class="field"><span id="nameLabel">用户名</span><input name="username" autocomplete="username" pattern="[a-zA-Z0-9_]+" minlength="3" maxlength="32" required></label><label class="field"><span id="phoneLabel">手机尾号4位</span><input name="phoneTail" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><label class="field"><span id="passwordLabel">密码 · 至少6位</span><input name="password" type="password" autocomplete="new-password" minlength="6" maxlength="64" required></label><button class="primary" id="submitButton">创建管理员</button></form><p id="error" class="form-error" role="alert"></p><section id="recoverySection" hidden><h2 id="recoveryTitle">保存私密恢复码</h2><code id="recoveryCode"></code><p id="recoveryNote">只显示这一次。请私下保存，用于忘记密码后自行恢复账户。</p><a id="continueLink" href="/account.html">进入个人账户</a></section></section></main><div class="dove-language-switch"><button id="languageButton" type="button" class="dove-language-toggle" role="switch" aria-checked="false"><span class="dove-language-thumb" aria-hidden="true"></span><span class="dove-language-label dove-language-label-zh">中</span><span class="dove-language-label dove-language-label-en">EN</span></button></div></body></html>
