<title>Dove Cup Moments · 金鸽杯</title>
<meta name="description" content="金鸽杯历次巡回赛与特别活动照片档案。">
<style>
:root{--ink:#17241e;--green:#143323;--forest:#0f291d;--ivory:#f8efd7;--paper:#fffaf0;--gold:#c99a3c;--clay:#a9653c;--line:rgba(20,51,35,.17)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#d8d2c7;font-family:"Songti SC","STSong",Georgia,"Times New Roman",serif}a{color:inherit;text-decoration:none}
.page-hero{position:relative;display:flex;min-height:clamp(440px,58svh,620px);padding:28px clamp(18px,5vw,72px) 52px;overflow:hidden;color:var(--ivory);isolation:isolate}.hero-photo{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center 78%}.page-hero:after{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,24,17,.9),rgba(8,24,17,.32) 68%,rgba(8,24,17,.12)),linear-gradient(180deg,rgba(8,24,17,.08),rgba(8,24,17,.82));content:""}
.hero-inner{display:flex;width:100%;flex-direction:column;justify-content:flex-end}.hero-copy{max-width:800px}.kicker{color:#e3bc65;font-family:"Avenir Next","Segoe UI",sans-serif;font-size:11px;font-weight:900;text-transform:uppercase}.hero-copy h1{margin:12px 0 14px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(56px,8vw,104px);font-weight:400;line-height:.88}.hero-copy p{max-width:620px;margin:0;color:rgba(248,239,215,.84);font-family:"Avenir Next","Segoe UI","PingFang SC",sans-serif;font-size:15px;line-height:1.7}
.archive-shell{padding:clamp(48px,7vw,86px) clamp(18px,5vw,72px)}.archive-inner{max-width:1260px;margin:0 auto}.archive-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.archive-head h2{margin:9px 0 0;font-size:clamp(38px,5vw,66px);font-weight:400;line-height:1}.count{color:var(--clay);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:12px;font-weight:900}.moment-archive-grid{margin-top:30px}
footer{display:flex;justify-content:space-between;gap:16px;padding:28px clamp(18px,5vw,72px);color:var(--ivory);background:var(--forest);font-family:"Avenir Next","Segoe UI",sans-serif;font-size:12px}
@media(max-width:680px){.page-hero{min-height:450px;padding-bottom:36px}.hero-photo{object-position:center 76%}.brand{font-size:12px}.hero-copy h1{font-size:50px}.hero-copy p{font-size:13px}.archive-head{align-items:flex-start;flex-direction:column}.archive-head h2{font-size:40px}footer{flex-direction:column}}
</style>
</head>
<body>
<header class="page-hero">
  <img class="hero-photo" src="assets/moments/event-14.jpg" alt="8月22日金鸽巡回赛活动合影">
  <div class="hero-inner">
    <div class="hero-copy"><div class="kicker">Dove Cup Moments</div><h1>活动照片档案</h1><p>活动照片从第一场排到最新一场，点击任意照片即可全屏查看。</p></div>
  </div>
</header>
<main class="archive-shell">
  <div class="archive-inner">
    <div class="archive-head"><div><div class="kicker" style="color:var(--clay)">Photo Archive</div><h2>完整影集</h2></div><div class="count" id="momentArchiveCount">0 张照片</div></div>
    <div class="moment-archive-grid" id="momentArchiveList"></div>
  </div>
</main>
<footer><span>Golden Dove Cup / 金鸽杯</span><span>Dove Cup Moments · Toronto</span></footer>
