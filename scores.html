<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="language.css?v=1">
<script src="language.js?v=7"></script>
<title>金鸽巡回赛 · 到场记录</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--green:#07C160;--green-dark:#059A4A;--green-light:#E8F9EF;--blue:#10AEFF;--blue-light:#EBF8FF;--orange:#FF8C00;--orange-light:#FFF3E0;--red:#FA5151;--gray-50:#FAFAFA;--gray-100:#F7F7F7;--gray-200:#EFEFEF;--gray-300:#DCDCDC;--gray-500:#999;--gray-700:#555;--ink:#1A1A1A;--white:#fff;--shadow:0 8px 28px rgba(0,0,0,.08);--shadow-soft:0 2px 12px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--gray-100);color:var(--ink);min-height:100dvh;padding:18px}.page{max-width:1080px;margin:0 auto}.hero{background:linear-gradient(135deg,#111827 0%,#0F9F57 78%);color:#fff;border-radius:24px;padding:24px;box-shadow:0 16px 44px rgba(17,24,39,.2);margin-bottom:16px}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.activity-kicker{margin-bottom:8px;color:#f2d58d;font-size:11px;font-weight:900;letter-spacing:.08em}h1{font-size:clamp(28px,4vw,44px);line-height:1.1;font-weight:900}.subtitle{margin-top:10px;font-size:14px;opacity:.9;line-height:1.6}.status-pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800}.actions,.admin-grid,.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.actions{margin-top:22px}.admin-control{display:none}body.is-admin .admin-control{display:flex}.btn{font-family:inherit;border:0;cursor:pointer;border-radius:999px;padding:11px 16px;font-size:14px;font-weight:900;background:#fff;color:var(--green-dark);box-shadow:0 4px 16px rgba(0,0,0,.1);transition:transform .12s ease}.btn.secondary{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);box-shadow:none}.btn:active{transform:scale(.97)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat-card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow-soft)}.stat-card .num{font-size:28px;font-weight:900;color:var(--green)}.stat-card .label{color:var(--gray-500);font-size:12px;margin-top:4px;font-weight:700}.panel{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}.panel-title{font-size:15px;font-weight:900;margin-bottom:12px}.admin-grid{align-items:flex-end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--gray-500);font-weight:800}.field input,.field select{min-width:160px;border:1.5px solid var(--gray-300);border-radius:12px;padding:10px 12px;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:var(--green)}.small-btn{border:0;border-radius:12px;padding:10px 13px;font:inherit;font-size:13px;font-weight:900;background:var(--green);color:#fff;cursor:pointer}.small-btn.blue{background:var(--blue)}.small-btn.red{background:var(--red)}.table-wrap{overflow:auto;border-radius:16px;border:1px solid var(--gray-200)}table{width:100%;border-collapse:collapse;background:#fff;min-width:680px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--gray-200);font-size:14px}th{font-size:12px;color:var(--gray-500);background:var(--gray-50);text-transform:uppercase;letter-spacing:.04em}td.rank{font-weight:900;color:var(--green);width:72px}.name{font-weight:900}.points{font-size:20px;font-weight:900;color:var(--green-dark)}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;background:var(--gray-100);font-size:12px;font-weight:800;color:var(--gray-700)}.empty{padding:30px;text-align:center;color:var(--gray-500);line-height:1.7}.note{font-size:13px;color:var(--gray-700);line-height:1.7}.log{display:grid;gap:8px}.log-row{display:flex;justify-content:space-between;gap:10px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--gray-700)}
.admin-cell{display:none}body.is-admin th.admin-cell,body.is-admin td.admin-cell{display:table-cell}.row-delete{border:0;border-radius:10px;padding:7px 10px;background:var(--red);color:#fff;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.special-event-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 14px;border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-50)}.special-event-row strong{display:block;font-size:14px}.special-event-meta,.special-event-names{display:block;margin-top:4px;color:var(--gray-500);font-size:12px;line-height:1.55}.special-event-count{color:var(--green-dark);font-size:18px;font-weight:900;white-space:nowrap}
@media(max-width:720px){body{padding:12px}.hero{border-radius:20px;padding:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.btn{width:100%}.field{width:100%}.field input,.field select{width:100%;min-width:0}.small-btn{width:100%}}
</style>
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="activity-kicker">常驻活动 · 金鸽巡回赛</div>
        <h1>到场记录</h1>
        <p class="subtitle">这里只记录每个人实际到场的次数。每周六晚 7 点归档后自动更新，不再记录胜局和积分。</p>
      </div>
      <div class="status-pill" id="syncStatus">实时同步中</div>
    </div>
    <div class="actions">
      <button class="btn" id="adminBtn" onclick="toggleAdmin()">Admin</button>
      <button class="btn secondary" onclick="goPage('signup.html')">报名页</button>
      <button class="btn secondary" onclick="goPage('courts.html')">场地分组</button>
      <button class="btn secondary" onclick="goPage('events.html')">活动中心</button>
    </div>
  </section>
  <section class="stats">
    <div class="stat-card"><div class="num" id="playerCount">0</div><div class="label">到场人员</div></div>
    <div class="stat-card"><div class="num" id="totalAppearances">0</div><div class="label">累计到场</div></div>
    <div class="stat-card"><div class="num" id="topAttendance">0</div><div class="label">最多到场</div></div>
    <div class="stat-card"><div class="num" id="recordedWeeks">0</div><div class="label">已记录周数</div></div>
  </section>
  <section class="panel admin-control">
    <div class="panel-title">管理员补录到场</div>
    <div class="admin-grid">
      <button class="small-btn" onclick="importCurrentJoined()">记录当前名单到场一次</button>
      <div class="field"><label>人员姓名</label><input id="playerNameInput" placeholder="输入姓名"></div>
      <button class="small-btn" onclick="addManualParticipation()">单独记录此人到场一次</button>
      <button class="small-btn red" onclick="resetPlayer()">删除此人到场记录</button>
      <button class="small-btn red" onclick="resetAllScores()">清空全部到场记录</button>
    </div>
    <p class="note" style="margin-top:12px">周六归档会自动记录正式名单；这里仅用于管理员修正到场次数。</p>
  </section>
  <section class="panel">
    <div class="panel-title">到场次数</div>
    <div class="table-wrap"><table><thead><tr><th>排名</th><th>姓名</th><th>到场次数</th><th>最近到场</th><th>状态</th><th class="admin-cell">操作</th></tr></thead><tbody id="scoreRows"></tbody></table></div>
    <div id="emptyState" class="empty" style="display:none">还没有到场记录。首次周六归档后，这里会自动显示。</div>
  </section>
  <section class="panel">
    <div class="panel-title">特别活动到场</div>
    <div id="specialAttendanceList" class="log"></div>
  </section>
  <section class="panel">
    <div class="panel-title">最近更新</div>
    <div id="eventLog" class="log"></div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
const ADMIN_PASSWORD='8888';
const ADMIN_STORAGE='scores_is_admin';
const SITE_VERSION='30';
const SIGNUP_DB_PATH='doveCupWaitlistSystem/main';
const SCORE_DB_PATH='doveCupWaitlistSystem/scores';
const FIREBASE_CONFIG={apiKey:'AIzaSyBPTwRAkfHjCA_RCQu5t2udzllF3Rz_CCo',authDomain:'dovecupdatabase.firebaseapp.com',databaseURL:'https://dovecupdatabase-default-rtdb.firebaseio.com/',projectId:'dovecupdatabase',storageBucket:'dovecupdatabase.firebasestorage.app',messagingSenderId:'814970094950',appId:'1:814970094950:web:c061c00eaceed40125b4a7'};
let scoreRef=null,signupRef=null,scoreData={players:{},events:[]},signupState={joined:[]},isAdminMode=sessionStorage.getItem(ADMIN_STORAGE)==='1';
function goPage(page){location.href=page}
if(new URLSearchParams(location.search).has('v')){history.replaceState(null,'',location.pathname)}
function keyForName(name){return name.trim().toLowerCase().replace(/[.#$/[\]]/g,'_')}
function normalizeScoreData(data){const next=data||{};next.players=next.players&&typeof next.players==='object'?next.players:{};next.events=Array.isArray(next.events)?next.events:[];next.attendanceWeeks=next.attendanceWeeks&&typeof next.attendanceWeeks==='object'?next.attendanceWeeks:{};next.attendanceEvents=next.attendanceEvents&&typeof next.attendanceEvents==='object'?next.attendanceEvents:{};Object.values(next.players).forEach(p=>{if(!p)return;delete p.points;delete p.wins;delete p.manualWins;delete p.courtWins});next.mode='attendance-only';return next}
function signupPlayers(){return Array.isArray(signupState.joined)?signupState.joined.filter(p=>p&&p.name):[]}
function playerList(){const map=new Map();signupPlayers().forEach(p=>{const key=keyForName(p.name);if(!key)return;map.set(key,{key,name:p.name,appearances:0,hasScoreRecord:false,fromSignup:true})});Object.entries(scoreData.players).forEach(([key,p])=>{if(!p||!p.name)return;map.set(key,Object.assign({},p,{key,hasScoreRecord:true,fromSignup:map.has(key)}))});return Array.from(map.values()).sort((a,b)=>(b.appearances||0)-(a.appearances||0)||String(a.name).localeCompare(String(b.name),'zh-Hans-CN'))}
function renderAdmin(){document.body.classList.toggle('is-admin',isAdminMode);document.getElementById('adminBtn').textContent=isAdminMode?'Admin 已登录':'Admin'}
function toggleAdmin(){if(isAdminMode){isAdminMode=false;sessionStorage.removeItem(ADMIN_STORAGE);renderAdmin();render();return}const pass=prompt('请输入管理员密码');if(pass===ADMIN_PASSWORD){isAdminMode=true;sessionStorage.setItem(ADMIN_STORAGE,'1');renderAdmin();render()}else if(pass!==null){alert('密码错误')}}
function requireAdmin(){if(isAdminMode)return true;alert('只有管理员可以更新到场记录');return false}
function saveScores(){if(scoreRef)scoreRef.set(Object.assign({},scoreData,{updatedAt:Date.now()})).catch(()=>alert('保存失败，请检查网络'))}
function ensurePlayer(name){const clean=name.trim();if(!clean)return null;const key=keyForName(clean);if(!scoreData.players[key])scoreData.players[key]={key,name:clean,appearances:0,lastPlayedAt:null,updatedAt:Date.now()};return scoreData.players[key]}
function addEvent(type,names){scoreData.events.unshift({type,names,ts:Date.now()});scoreData.events=scoreData.events.slice(0,20)}
function importCurrentJoined(){if(!requireAdmin())return;const joined=Array.isArray(signupState.joined)?signupState.joined:[];if(!joined.length){alert('当前报名名单为空');return}joined.forEach(p=>{const player=ensurePlayer(p.name);if(!player)return;player.appearances=(player.appearances||0)+1;player.lastPlayedAt=Date.now();player.updatedAt=Date.now()});addEvent('participation',joined.map(p=>p.name));saveScores();render()}
function addManualParticipation(){if(!requireAdmin())return;const name=document.getElementById('playerNameInput').value.trim();const player=ensurePlayer(name);if(!player){alert('请输入姓名');return}player.appearances=(player.appearances||0)+1;player.lastPlayedAt=Date.now();player.updatedAt=Date.now();addEvent('manualParticipation',[player.name]);saveScores();render()}
function resetPlayer(){if(!requireAdmin())return;const name=document.getElementById('playerNameInput').value.trim();if(!name){alert('请输入要删除的姓名');return}deletePlayerByKey(keyForName(name))}
function deletePlayerFromButton(btn){deletePlayerByKey(btn.dataset.key)}
function deletePlayerByKey(key){if(!requireAdmin())return;const player=scoreData.players[key];if(!player){alert('到场记录里找不到这个人');return}if(!confirm(`确定删除 ${player.name} 的到场记录吗？`))return;delete scoreData.players[key];addEvent('deletePlayer',[player.name]);saveScores();render()}
function resetAllScores(){if(!requireAdmin())return;if(!confirm('确定清空全部到场记录吗？'))return;scoreData={players:{},attendanceWeeks:{},events:[{type:'resetAll',names:[],ts:Date.now()}],mode:'attendance-only'};saveScores();render()}
function formatDate(ts){return ts?new Date(ts).toLocaleDateString('zh-CN',{timeZone:'America/Toronto'}):'—'}
function renderSpecialAttendance(){const events=Object.values(scoreData.attendanceEvents||{}).filter(item=>item&&item.eventId).sort((a,b)=>(Number(b.recordedAt)||0)-(Number(a.recordedAt)||0));document.getElementById('specialAttendanceList').innerHTML=events.length?events.map(item=>`<div class="special-event-row"><div><strong>${escapeHtml(item.title||item.eventId)}</strong><span class="special-event-meta">${escapeHtml([item.date,item.venue].filter(Boolean).join(' · '))}</span><span class="special-event-names" data-dove-no-translate>${escapeHtml((item.names||[]).join('、'))}</span></div><span class="special-event-count">${Number(item.count)||0} 人</span></div>`).join(''):'<div class="empty">活动归档后，参赛名单会保留在这里。</div>'}
function render(){const list=playerList();document.getElementById('playerCount').textContent=list.filter(p=>p.hasScoreRecord).length;document.getElementById('totalAppearances').textContent=list.reduce((s,p)=>s+(p.appearances||0),0);document.getElementById('topAttendance').textContent=list[0]?.appearances||0;document.getElementById('recordedWeeks').textContent=Object.keys(scoreData.attendanceWeeks||{}).length;document.getElementById('emptyState').style.display=list.length?'none':'block';document.getElementById('scoreRows').innerHTML=list.map((p,i)=>`<tr><td class="rank">${i+1}</td><td class="name">${escapeHtml(p.name)}</td><td class="points">${p.appearances||0} 次</td><td>${formatDate(p.lastPlayedAt)}</td><td>${p.hasScoreRecord?'已记录':'已报名，暂未到场'}</td><td class="admin-cell">${p.hasScoreRecord?`<button class="row-delete" data-key="${escapeHtml(p.key)}" onclick="deletePlayerFromButton(this)">删除</button>`:'<span class="tag">报名名单</span>'}</td></tr>`).join('');document.getElementById('eventLog').innerHTML=scoreData.events.length?scoreData.events.slice(0,8).map(e=>`<div class="log-row"><span>${eventText(e)}</span><span>${new Date(e.ts).toLocaleString('zh-CN')}</span></div>`).join(''):'<div class="empty">暂无更新记录</div>';renderSpecialAttendance()}
function eventText(e){if(e.type==='attendanceOnly')return '已切换为只记录到场次数';if(e.type==='weeklyAttendance')return `${e.resetId||'本周'} 自动记录到场：${e.count??(e.names||[]).length} 人`;if(e.type==='specialEventAttendance')return `特别活动 · ${e.title||e.eventId}：${e.count??(e.names||[]).length} 人到场`;if(e.type==='participation')return `记录到场：${(e.names||[]).length} 人`;if(e.type==='manualParticipation')return `${(e.names||[])[0]} 记录到场一次`;if(e.type==='deletePlayer'||e.type==='resetPlayer')return `${(e.names||[])[0]} 到场记录已删除`;if(e.type==='resetAll')return '全部到场记录已清空';return '到场记录已更新'}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function start(){renderAdmin();if(!window.firebase||!firebase.database){document.getElementById('syncStatus').textContent='Firebase 加载失败';render();return}if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);scoreRef=firebase.database().ref(SCORE_DB_PATH);signupRef=firebase.database().ref(SIGNUP_DB_PATH);scoreRef.on('value',snap=>{scoreData=normalizeScoreData(snap.val());document.getElementById('syncStatus').textContent='到场记录实时同步中';render()});signupRef.on('value',snap=>{const data=snap.val();signupState=data&&data.state?data.state:{joined:[]};render()})}
start();
</script>
</body>
</html>
